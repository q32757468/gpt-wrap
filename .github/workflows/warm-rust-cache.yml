name: Warm Rust build cache

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/warm-rust-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    name: Warm Windows Rust cache
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out main branch
        uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: gpt-wrap-windows-release
          workspaces: src-tauri -> target

      - name: Compile release dependencies
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
