name: Release GPTWrap

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid release tag '$tag'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          }

          Write-Host "Release tag: $tag"

      - name: Validate release versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expectedVersion = $tag.Substring(1)

          $packageJson = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
          $tauriConfig = Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json

          $cargoContent = Get-Content -Raw -LiteralPath 'src-tauri/Cargo.toml'
          $packageSectionMatch = [regex]::Match(
            $cargoContent,
            '(?ms)^\[package\][\r\n]+(?<content>.*?)(?=^\[|\z)'
          )
          if (-not $packageSectionMatch.Success) {
            Write-Error 'Could not find the [package] section in src-tauri/Cargo.toml.'
            exit 1
          }

          $cargoVersionMatch = [regex]::Match(
            $packageSectionMatch.Groups['content'].Value,
            '(?m)^\s*version\s*=\s*["'']([^"'']+)["'']\s*(?:#.*)?$'
          )
          if (-not $cargoVersionMatch.Success) {
            Write-Error 'Could not find package.version in the [package] section of src-tauri/Cargo.toml.'
            exit 1
          }

          $packageVersion = [string]$packageJson.version
          $tauriVersion = [string]$tauriConfig.version
          $cargoVersion = $cargoVersionMatch.Groups[1].Value

          Write-Host 'Release version validation'
          Write-Host ('Tag:               {0}' -f $tag)
          Write-Host ('Expected:          {0}' -f $expectedVersion)
          Write-Host ('package.json:      {0}' -f $packageVersion)
          Write-Host ('tauri.conf.json:   {0}' -f $tauriVersion)
          Write-Host ('Cargo.toml:        {0}' -f $cargoVersion)

          if (
            [string]::IsNullOrWhiteSpace($packageVersion) -or
            [string]::IsNullOrWhiteSpace($tauriVersion) -or
            [string]::IsNullOrWhiteSpace($cargoVersion) -or
            $packageVersion -ne $expectedVersion -or
            $tauriVersion -ne $expectedVersion -or
            $cargoVersion -ne $expectedVersion
          ) {
            Write-Error 'Release tag version does not match every project version.'
            exit 1
          }

      - name: Refuse to overwrite an existing Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          try {
            $existingRelease = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          } catch {
            $statusCode = 0
            if ($null -ne $_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -eq 404) {
              Write-Host "No existing Release found for $tag."
              exit 0
            }

            throw
          }

          if ($null -ne $existingRelease) {
            throw "A GitHub Release already exists for $tag. Refusing to overwrite it."
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: gpt-wrap-windows-release
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GPTWrap ${{ github.ref_name }}
          releaseBody: |
            ## GPTWrap ${{ github.ref_name }}

            请在下方 Assets 中下载 Windows 安装包：

            - `.exe`：NSIS 安装包，推荐普通用户使用
            - `.msi`：Windows Installer 安装包

            > 当前版本未进行 Windows 代码签名，安装时可能出现 SmartScreen 或“未知发布者”提示。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          projectPath: .
          tauriScript: pnpm tauri
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle'
          if (-not (Test-Path -LiteralPath $bundleRoot)) {
            throw "Tauri bundle directory was not created: $bundleRoot"
          }

          $installers = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in @('.exe', '.msi') }
          )
          $exeInstallers = @($installers | Where-Object { $_.Extension -eq '.exe' })
          $msiInstallers = @($installers | Where-Object { $_.Extension -eq '.msi' })

          $installers | ForEach-Object {
            Write-Host ("Installer: {0} ({1} bytes)" -f $_.FullName, $_.Length)
          }

          if ($exeInstallers.Count -eq 0 -or $msiInstallers.Count -eq 0) {
            throw 'Expected at least one NSIS .exe installer and one WiX .msi installer.'
          }
