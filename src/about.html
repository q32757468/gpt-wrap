<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 GPTWrap</title>
    <link rel="stylesheet" href="./about.css" />
  </head>
  <body>
    <main
      class="about-window"
      role="dialog"
      aria-labelledby="gptwrap-about-title"
      aria-describedby="gptwrap-about-description"
    >
      <img class="about-icon" alt="" />
      <h1 class="about-title" id="gptwrap-about-title">GPTWrap</h1>
      <p class="about-description" id="gptwrap-about-description">一个简洁的 ChatGPT 桌面客户端</p>
      <a class="about-github" target="_blank" rel="noopener noreferrer">
        <span class="about-github-label">项目主页</span>
        <span class="about-github-url"></span>
      </a>
      <p class="about-version">版本 <span class="about-version-number"></span></p>

      <section class="about-update" aria-labelledby="about-update-title" hidden>
        <h2 class="about-update-title" id="about-update-title">应用更新</h2>
        <p class="about-update-status" role="status" aria-live="polite">尚未检查更新</p>
        <p class="about-update-detail" hidden></p>
        <div class="about-update-progress" hidden>
          <progress class="about-update-progress-bar" max="100" value="0"></progress>
          <span class="about-update-progress-label" aria-live="polite"></span>
        </div>
        <div class="about-update-actions">
          <button class="about-update-check" type="button">检查更新</button>
          <button class="about-update-install" type="button" hidden>立即更新</button>
        </div>
        <a class="about-update-release" target="_blank" rel="noopener noreferrer" hidden>
          查看发布说明
        </a>
        <pre class="about-update-error" role="alert" aria-live="assertive" hidden></pre>
      </section>
    </main>
    <script src="./about.js"></script>
  </body>
</html>
